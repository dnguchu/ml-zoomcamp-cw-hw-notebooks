[project]
name = "ml-zoomcamp-cw-hw-notebooks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dennis Guchu", email = "gitaudennis59@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.157.0",
    "jupyter>=1.1.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ml-zoomcamp-cw-hw-notebooks = "ml_zoomcamp_cw_hw_notebooks:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "requests>=2.34.2",
]
